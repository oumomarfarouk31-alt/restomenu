<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cuisine — RestoMenu</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0b1220;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.panel,.order{background:#111c2e;border:1px solid rgba(148,163,184,.14)}.muted{color:#91a2b8}button:disabled{opacity:.5;cursor:not-allowed}</style></head><body class="min-h-screen"><header class="border-b border-slate-800 bg-slate-950/70"><div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3"><div><a href="/" class="text-xs text-emerald-300 font-bold tracking-widest">RESTOMENU</a><h1 id="restaurant-name" class="text-2xl font-extrabold mt-1">Cuisine</h1><p class="text-xs muted">Écran de préparation des commandes</p></div><div class="flex gap-2"><span id="role" class="hidden sm:flex items-center text-xs muted"></span><button id="refresh" class="rounded-xl border border-slate-700 px-3 py-2 text-sm">Actualiser</button><button id="logout" class="rounded-xl border border-slate-700 px-3 py-2 text-sm">Déconnexion</button></div></div></header><main class="max-w-7xl mx-auto px-4 py-7"><section id="notice" class="hidden panel rounded-2xl p-4 mb-6 text-sm" role="status"></section><section id="board" class="hidden"><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"><article class="panel rounded-2xl p-4"><p class="text-xs muted">Nouvelles</p><b id="pending-count" class="text-3xl block mt-2">0</b></article><article class="panel rounded-2xl p-4"><p class="text-xs muted">En préparation</p><b id="preparing-count" class="text-3xl block mt-2">0</b></article><article class="panel rounded-2xl p-4"><p class="text-xs muted">Prêtes</p><b id="ready-count" class="text-3xl block mt-2">0</b></article><article class="panel rounded-2xl p-4"><p class="text-xs muted">Commandes affichées</p><b id="total-count" class="text-3xl block mt-2">0</b></article></div><div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h2 class="font-bold text-lg">Commandes</h2><p id="updated" class="text-xs muted mt-1">Chargement…</p></div><div id="filters" class="flex flex-wrap gap-2"><button data-filter="active" class="filter rounded-xl px-3 py-2 text-xs bg-emerald-400 text-slate-950 font-bold">Actives</button><button data-filter="pending" class="filter rounded-xl px-3 py-2 text-xs border border-slate-700">Nouvelles</button><button data-filter="preparing" class="filter rounded-xl px-3 py-2 text-xs border border-slate-700">En préparation</button><button data-filter="ready" class="filter rounded-xl px-3 py-2 text-xs border border-slate-700">Prêtes</button><button data-filter="all" class="filter rounded-xl px-3 py-2 text-xs border border-slate-700">Toutes</button></div></div><div id="orders" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></div></section></main><script src="/assets/js/kitchen-display.js"></script></body></html>
