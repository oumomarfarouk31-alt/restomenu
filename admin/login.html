<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Connexion équipe — RestoMenu</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0b1220;color:#f8fafc;font-family:Inter,system-ui,sans-serif}input{color-scheme:dark}</style></head><body class="min-h-screen grid place-items-center p-5"><main class="w-full max-w-md rounded-3xl border border-slate-700 bg-slate-900 p-8"><a href="/" class="text-sm text-emerald-300">← RestoMenu</a><p class="text-xs tracking-widest text-emerald-300 font-bold mt-8">ESPACE ÉQUIPE</p><h1 class="text-3xl font-extrabold mt-2">Connexion</h1><p class="text-sm text-slate-400 mt-2 mb-7">Accédez à votre espace de gestion.</p><div id="notice" class="hidden rounded-xl border border-amber-400/30 bg-amber-400/10 p-3 text-sm text-amber-200 mb-4"></div><form id="login-form" class="space-y-4"><label class="block text-sm">Adresse e-mail<input id="email" type="email" autocomplete="username" required class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3"></label><label class="block text-sm">Mot de passe<input id="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3"></label><button id="submit" class="w-full rounded-xl bg-emerald-400 text-slate-950 font-bold py-3">Se connecter</button></form><p id="error" class="hidden text-sm text-rose-300 mt-4" role="alert"></p><p class="text-xs text-slate-500 mt-7">Les accès sont créés par le responsable du restaurant. L'inscription publique est désactivée.</p></main><script>(()=>{const p=location.pathname.split('/').filter(Boolean),slug=p[0]==='admin'?'mimosa':p[0]||'mimosa',next='/'+slug+'/admin',form=document.getElementById('login-form'),btn=document.getElementById('submit'),err=document.getElementById('error');(async()=>{try{const r=await fetch('/api/config',{cache:'no-store'}),c=await r.json().catch(()=>({}));if(!r.ok||!c.supabaseUrl||!c.supabaseKey||!window.supabase)throw Error(c.message||'Supabase indisponible.');const db=window.supabase.createClient(c.supabaseUrl,c.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),s=await db.auth.getSession();if(s.data.session)return location.replace(next);form.addEventListener('submit',async e=>{e.preventDefault();err.classList.add('hidden');btn.disabled=true;btn.textContent='Connexion…';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});btn.disabled=false;btn.textContent='Se connecter';if(error){err.textContent='Connexion refusée. Vérifiez vos identifiants.';err.classList.remove('hidden');return}location.replace(next)})}catch(e){const n=document.getElementById('notice');n.textContent=e.message;n.classList.remove('hidden');btn.disabled=true}})()})();</script></body></html>
